<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Product Details | Samarth Industries</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="topbar">
        <div class="wrap">Pune, Maharashtra, India  <span>📞 +91 8830507390,📞 +91 9604802520</span></div>
    </div>
    <header>
        <div class="wrap header-main"><a class="logo" href="index.html"><b>SI</b><span>SAMARTH INDUSTRIES<small>DI PIPE MS
                        COMPONENTS</small></span></a><button id="menuBtn">☰</button>
            <nav id="nav"><a href="index.html">Home</a><a href="about.html">About Us</a><a class="active"
                    href="products.html">Our Products</a><a href="contact.html">Contact Us</a></nav>
        </div>
    </header>
    <div class="crumb">
        <div class="wrap"><a href="products.html">Our Products</a> » <span id="bread">Product</span></div>
    </div>
    <main class="wrap product-detail">
        <div class="detail-image">
            <img id="detailImage" src="${p.image}" alt="">
        </div>
        <div>
            <p class="orange" id="detailCat"></p>
            <h1 id="detailName"></h1>
            <p id="detailDesc"></p>
            <div class="price">Get Latest Price</div><a class="button" href="contact.html">YES! I AM INTERESTED</a>
        </div>
    </main>
    <section class="wrap details">
        <h2>Product Details</h2>
        <table id="specs"></table>
        <h2>Description</h2>
        <p id="detailLong"></p>
    </section>
    <footer id="footer"></footer>
    <script src="script.js"></script>
</body>

</html>
